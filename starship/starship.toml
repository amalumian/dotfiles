"$schema" = 'https://starship.rs/config-schema.json'

palette = "tokyonight_moon"

[character]
success_symbol = "[[](green) ❯](orange)"
error_symbol = "[[](red) ❯](orange)"
vimcmd_symbol = "[ ❮](fg_dark)"

[git_branch]
style = "bold magenta"

[directory]
truncation_length = 4
style = "bold blue"

[palettes.tokyonight_moon]
red = "#ff757f"
orange = "#ff966c"
yellow = "#ffc777"
green = "#c3e88d"
teal = "#4fd6be"
cyan = "#86e1fc"
blue = "#82aaff"
magenta = "#c099ff"
purple = "#fca7ea"
fg = "#c8d3f5"
fg_dark = "#828bb8"
bg = "#222436"
bg_dark = "#1e2030"
bg_highlight = "#2f334d"
